name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and check only — do not upload to PyPI"
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Tag matches the packaged version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python - <<'PY'
          import os, re, sys, pathlib
          tag = os.environ["GITHUB_REF_NAME"].lstrip("v")
          src = pathlib.Path("ast_mcp/__init__.py").read_text()
          version = re.search(r'__version__ = "([^"]+)"', src).group(1)
          if tag != version:
              sys.exit(f"tag {tag!r} != ast_mcp.__version__ {version!r}")
          print(f"releasing {version}")
          PY

      - name: Suite must be green before anything ships
        run: uv run --group dev pytest -q

      - name: Build
        run: uv build

      - uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') && !inputs.dry_run
    environment: pypi
    permissions:
      # Trusted publishing — no API token stored in the repo. Configure the
      # publisher once at https://pypi.org/manage/project/ast-mcp/settings/publishing/
      id-token: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist/

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Publish to PyPI
        run: uv publish --trusted-publishing always

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist/
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
